name: updpkgsums
on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "*/PKGBUILD"
jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Find updated package
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail
          PKGBUILD_PATH="$(git diff --name-only origin/master origin/${GITHUB_HEAD_REF} "*/PKGBUILD" | head -1)"
          PKGBUILD_DIR="${PKGBUILD_PATH%/*}"
          echo "PKGBUILD_DIR=$PKGBUILD_DIR" >> "$GITHUB_ENV"
      - name: Validate package
        if: ${{ env.PKGBUILD_DIR != '' }}
        uses: ./.github/actions/aur
        with:
          action: "updpkgsums"
          pkgname: ${{ env.PKGBUILD_DIR }}
      - name: Commit
        if: ${{ env.PKGBUILD_DIR != '' }}
        uses: stefanzweifel/git-auto-commit-action@e348103e9026cc0eee72ae06630dbe30c8bf7a79 # v5.1.0
        with:
          file_pattern: "*/PKGBUILD */.SRCINFO"
